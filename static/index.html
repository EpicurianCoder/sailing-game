<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <title>Sailing Engine (PixiJS)</title>    <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>    <style>        body {             background: #121212;             color: #e0e0e0;             font-family: monospace;             display: flex;             flex-direction: column;             align-items: center;             padding-top: 30px;             margin: 0;        }        #game-wrapper {            position: relative; /* Allows floating HUD elements inside */            width: 512px;            height: 512px;            border: 4px solid #333;            border-radius: 8px;            overflow: hidden;            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);        }        /* HUD Overlay styling */        #hud-overlay {            position: absolute;            bottom: 12px;            left: 12px;            background: rgba(0, 0, 0, 0.65);            padding: 8px 12px;            border-radius: 4px;            font-size: 0.85em;            pointer-events: none; /* Mouse clicks pass through to game */            border: 1px solid rgba(255, 255, 255, 0.1);        }        /* Game Over Screen Overlay */        #end-screen {            display: none;             position: absolute;             top: 0; left: 0;             width: 100%; height: 100%;             background: black;             z-index: 10;             justify-content: center;             align-items: center;             flex-direction: column;        }        .hud-row { margin: 2px 0; }        .controls { margin-top: 15px; color: #888; font-size: 0.9em; font-family: sans-serif; }    </style></head><body>    <h2>Sailing Engine 1.0</h2>        <div id="game-wrapper">        <div id="end-screen"></div>        <div id="canvas-container"></div>        <!-- Real-time HUD elements -->        <div id="hud-overlay">            <div class="hud-row">SPEED : <span id="hud-speed" style="color: #00FFFF;">0.00</span> kn</div>            <div class="hud-row">RUDDER: <span id="hud-rudder" style="color: #FFCC00;">0.00</span></div>            <div class="hud-row">ROPE  : <span id="hud-rope" style="color: #FF66CC;">0.00</span></div>        </div>    </div>    <div id="ui-panel" style="margin-top: 15px; width: 512px; display: flex; justify-content: space-between; align-items: center;">        <div style="display: flex; flex-direction: column; width: 45%;">            <label style="color: #888; font-size: 0.9em; margin-bottom: 5px;">Rudder Control</label>            <div style="display: flex; gap: 10px;">                <input type="range" id="slider-rudder" min="-1" max="1" step="0.1" value="0" style="flex-grow: 1;">                <button id="btn-center" style="background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer;">Zero</button>            </div>        </div>                <div style="display: flex; flex-direction: column; width: 45%;">            <label style="color: #888; font-size: 0.9em; margin-bottom: 5px;">Sail Trim (Rope)</label>            <input type="range" id="slider-rope" min="0" max="1" step="0.05" value="0">        </div>    </div>        <div class="controls">        <p>Use <b>Arrow Keys</b> or <b>Sliders</b> to control the boat.</p>    </div>    <script src="/static/game.js"></script></body></html>
