<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <title>Sailing Engine (PixiJS)</title>    <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>    <style>        body {             background: #121212;             color: #e0e0e0;             font-family: monospace;             display: flex;             flex-direction: column;             align-items: center;             padding-top: 30px;             margin: 0;        }        #game-wrapper {            position: relative; /* Allows floating HUD elements inside */            width: 512px;            height: 512px;            border: 4px solid #333;            border-radius: 8px;            overflow: hidden;            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);        }        /* HUD Overlay styling */        #hud-overlay {            position: absolute;            bottom: 12px;            left: 12px;            background: rgba(0, 0, 0, 0.65);            padding: 8px 12px;            border-radius: 4px;            font-size: 0.85em;            pointer-events: none; /* Mouse clicks pass through to game */            border: 1px solid rgba(255, 255, 255, 0.1);        }        .hud-row { margin: 2px 0; }        .controls { margin-top: 15px; color: #888; font-size: 0.9em; font-family: sans-serif; }    </style></head><body>    <h2>Sailing Simulator</h2>        <div id="game-wrapper">        <div id="canvas-container"></div>        <!-- Real-time HUD elements -->        <div id="hud-overlay">            <div class="hud-row">SPEED : <span id="hud-speed" style="color: #00FFFF;">0.00</span> kn</div>            <div class="hud-row">RUDDER: <span id="hud-rudder" style="color: #FFCC00;">0.00</span></div>            <div class="hud-row">ROPE  : <span id="hud-rope" style="color: #FF66CC;">0.00</span></div>        </div>    </div>    <div class="controls">        <p>Use <b>Arrow Keys</b>: Steer (Left/Right) | Trim Rope (Up/Down)</p>    </div>    <script src="/static/game.js"></script></body></html>
